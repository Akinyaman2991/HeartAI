<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>HeartAI - Giriş & Kayıt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 { font-weight: 800; margin: 0; }
        h2 { text-align: center; }
        p { font-size: 14px; font-weight: 100; line-height: 20px; letter-spacing: 0.5px; margin: 20px 0 30px; }
        span { font-size: 12px; }
        a { color: #333; font-size: 14px; text-decoration: none; margin: 15px 0; }
        
        /* ana kara kutu */
        .container {
            background-color: #1e293b;
            border-radius: 20px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            position: relative;
            overflow: hidden;
            width: 850px;
            max-width: 100%;
            min-height: 550px;
            border: 1px solid #334155;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        /* form elemanları */
        form {
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
            color: #fff;
        }

        .social-container { margin: 20px 0; }
        .social-container a {
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            height: 40px;
            width: 40px;
            color: #fff;
            transition: 0.3s;
        }
        .social-container a:hover { background: #4f46e5; border-color: #4f46e5; }

        input {
            background-color: #0f172a;
            border: 1px solid #334155;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #4f46e5; }

        button {
            border-radius: 20px;
            border: 1px solid #4f46e5;
            background-color: #4f46e5;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active { transform: scale(0.95); }
        button:focus { outline: none; }
        button.ghost { background-color: transparent; border-color: #FFFFFF; }

        /* animasyon */
        .sign-in-container {
            left: 0;
            width: 50%;
            z-index: 2;
        }

        .container.right-panel-active .sign-in-container { transform: translateX(100%); }

        .sign-up-container {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% { opacity: 0; z-index: 1; }
            50%, 100% { opacity: 1; z-index: 5; }
        }

        /* Kayan panel kısmı */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container { transform: translateX(-100%); }

        .overlay {
            background: #4f46e5;
            background: linear-gradient(to right, #4f46e5, #7c3aed);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: 0 0;
            color: #FFFFFF;
            position: relative;
            left: -100%;
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .container.right-panel-active .overlay { transform: translateX(50%); }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .overlay-left { transform: translateX(-20%); }
        .container.right-panel-active .overlay-left { transform: translateX(0); }
        .overlay-right { right: 0; transform: translateX(0); }
        .container.right-panel-active .overlay-right { transform: translateX(20%); }

        /* Hareketli arka plan */
        .bg-circles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1;
        }
        .bg-circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px; height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: animate 25s linear infinite;
            bottom: -150px;
        }
        .bg-circles li:nth-child(1){ left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .bg-circles li:nth-child(2){ left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .bg-circles li:nth-child(3){ left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .bg-circles li:nth-child(4){ left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        
        @keyframes animate {
            0%{ transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100%{ transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }
        /* Sayfa ilk açıldığında süzülme efekti */
body {
    animation: pageIn 0.6s ease-out forwards;
    opacity: 0; /* Başlangıçta gizle, animasyonla aç */
}

@keyframes pageIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Kartların sırayla gelmesi için (Opsiyonel) */
.card {
    animation: cardSlide 0.8s ease-out;
}

@keyframes cardSlide {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
    </style>
</head>
<body>

    <ul class="bg-circles">
        <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="container" id="container">
        
        <div class="form-container sign-up-container">
            <form action="#">
                <h1>Hesap Oluştur</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-google"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>veya e-posta ile kayıt ol</span>
                <input type="text" placeholder="Ad Soyad" />
                <input type="email" placeholder="E-Posta" />
                <input type="password" placeholder="Şifre" />
                <button type="button" onclick="handleRegister()">Kayıt Ol</button>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form action="#">
                <h1>Giriş Yap</h1>
                <div class="social-container">
                    <a href="#" class="social"><i class="fab fa-google"></i></a>
                    <a href="#" class="social"><i class="fab fa-linkedin-in"></i></a>
                </div>
                <span>Hesabınızı kullanın</span>
                <input type="email" placeholder="E-Posta" value="admin@HeartAI.com" />
                <input type="password" placeholder="Şifre" value="123456" />
                <a href="#" style="color:#94a3b8; font-size:12px;">Şifremi unuttum?</a>
                <button type="button" onclick="handleLogin()">Giriş Yap</button>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Tekrar Hoşgeldin!</h1>
                    <p>Zaten bir hesabın var mı?</p>
                    <button class="ghost" id="signIn">Giriş Yap</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>HeartAI</h1>
                    <p>Yapay zeka destekli sağlık asistanın seni bekliyor.</p>
                    <button class="ghost" id="signUp">Kayıt Ol</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const signUpButton = document.getElementById('signUp');
        const signInButton = document.getElementById('signIn');
        const container = document.getElementById('container');

        // Panel Kaydırma efekti
        signUpButton.addEventListener('click', () => container.classList.add("right-panel-active"));
        signInButton.addEventListener('click', () => container.classList.remove("right-panel-active"));

        // --- kayıt olma fonksiyon ---
        async function handleRegister() {
    
            const inputs = document.querySelectorAll('.sign-up-container input');
            const name = inputs[0].value;
            const email = inputs[1].value;
            const password = inputs[2].value;

            const btn = document.querySelector('.sign-up-container button');
            const originalText = btn.innerText;
            btn.innerText = "Kaydediliyor...";

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, email, password })
                });
                const result = await response.json();
                alert(result.message);
                
                if(result.success) {
            
                    container.classList.remove("right-panel-active");
                }
            } catch(e) { alert("Bağlantı hatası!"); }
            
            btn.innerText = originalText;
        }

        // --- giriş yapma fonksiyonu ---
        async function handleLogin() {
            const inputs = document.querySelectorAll('.sign-in-container input');
            const email = inputs[0].value;
            const password = inputs[1].value;

            const btn = document.querySelector('.sign-in-container button');
            btn.innerText = "Giriş Yapılıyor...";

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();
                
                if(result.success) {
                    window.location.href = "/dashboard";
                } else {
                    alert(result.message);
                    btn.innerText = "Giriş Yap";
                }
            } catch(e) { 
                alert("Bağlantı hatası!"); 
                btn.innerText = "Giriş Yap";
            }
        }
        
document.addEventListener('DOMContentLoaded', () => {
    // Tüm linkleri yakala
    const links = document.querySelectorAll('a');
    
    links.forEach(link => {
        link.addEventListener('click', e => {
            // Sadece kendi sitemiz içindeki linkler için çalışsın
            if (link.hostname === window.location.hostname && !link.target && !link.href.includes('#')) {
                e.preventDefault();
                const destination = link.href;
                
                // Sayfayı yavaşça karart
                document.body.style.transition = 'opacity 0.4s ease-in-out, transform 0.4s ease-in-out';
                document.body.style.opacity = '0';
                document.body.style.transform = 'translateY(-10px)';
                
                // Animasyon bitince yeni sayfaya git
                setTimeout(() => {
                    window.location.href = destination;
                }, 400);
            }
        });
    });
});

    </script>
</body>
</html>
